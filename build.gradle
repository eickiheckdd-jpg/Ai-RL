plugins {
    id 'fabric-loom' version '1.14' // Loom target for 1.21.11
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'maven-publish'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    mappings "net.fabricmc:yarn:1.21.11+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:0.18.1"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.139.4+1.21.11"

    // Shaded dependencies for DL4J/ND4J
    implementation 'org.deeplearning4j:deeplearning4j-core:1.0.0-M2.1'
    implementation 'org.nd4j:nd4j-native-platform:1.0.0-M2.1'

    shadow 'org.deeplearning4j:deeplearning4j-core:1.0.0-M2.1'
    shadow 'org.nd4j:nd4j-native-platform:1.0.0-M2.1'
}

shadowJar {
    configurations = [project.configurations.shadow]
    archiveClassifier = "shadow"
    
    exclude "META-INF/*.SF"
    exclude "META-INF/*.DSA"
    exclude "META-INF/*.RSA"
}

remapJar {
    dependsOn shadowJar
    inputFile = shadowJar.archiveFile
}
