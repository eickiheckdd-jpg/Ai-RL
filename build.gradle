plugins {
    id 'fabric-loom' version '1.5-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1' // 1. Add Shadow Plugin
    id 'maven-publish'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.1"
    mappings "net.fabricmc:yarn:1.21.1+build.3:v2"
    modImplementation "net.fabricmc:fabric-loader:0.15.11"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.92.2+1.21.1"

    // 2. Mark DeepLearning4J & ND4J dependencies for Shadowing
    implementation 'org.deeplearning4j:deeplearning4j-core:1.0.0-M2.1'
    implementation 'org.nd4j:nd4j-native-platform:1.0.0-M2.1'

    shadow 'org.deeplearning4j:deeplearning4j-core:1.0.0-M2.1'
    shadow 'org.nd4j:nd4j-native-platform:1.0.0-M2.1'
}

// 3. Configure Shadow task to bundle all transitives
shadowJar {
    configurations = [project.configurations.shadow]
    archiveClassifier = "shadow"
    
    // Prevents metadata conflicts inside the shaded jar
    exclude "META-INF/*.SF"
    exclude "META-INF/*.DSA"
    exclude "META-INF/*.RSA"
}

// 4. Force remapJar to use the shadowed JAR as input
remapJar {
    dependsOn shadowJar
    inputFile = shadowJar.archiveFile
}
