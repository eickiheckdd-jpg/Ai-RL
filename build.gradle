plugins {
id 'fabric-loom' version "${loom_version}"
id 'maven-publish'
}

repositories {
mavenCentral()
}

dependencies {
minecraft "com.mojang:minecraft:${minecraft_version}"

mappings "net.fabricmc:yarn:${yarn_mappings}:v2"

modImplementation "net.fabricmc:fabric-loader:${loader_version}"

modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

// ONNX Runtime
implementation "com.microsoft.onnxruntime:onnxruntime:1.29.0"

// Bundle ONNX Runtime inside the mod JAR.
include "com.microsoft.onnxruntime:onnxruntime:1.29.0"

}

/*

* Prevent duplicate files from causing sourcesJar to fail.
* 
* This fixes the .gitkeep duplicate error you encountered
* during the previous build.
  */
  tasks.named("sourcesJar") {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
  }

/*

* Keep normal Java compilation compatible with Java 21.
  */
  java {
  withSourcesJar()
  }

tasks.withType(JavaCompile).configureEach {
options.release = 21
}